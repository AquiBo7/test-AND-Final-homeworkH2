<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云南大学虚拟荣誉殿堂</title>
  <script src="https://cdn.staticfile.net/aframe/1.4.2/aframe.min.js"></script>
  <style>
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      display: inline-block;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #ffffff;
      border-radius: 999px;
      color: #ffffff;
      font-weight: bold;
      text-decoration: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <a class="back-btn" href="../index.html">⬅ 返回组队大厅</a>

  <a-scene shadow="type: pcfsoft">
    <a-sky color="#1e293b"></a-sky>

    <a-plane position="0 0 -4" rotation="-90 0 0" width="50" height="50" color="#334155" metalness="0.5" roughness="0.8" shadow="receive: true"></a-plane>

    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" position="2 6 5" color="#ffffff" intensity="1.0" castShadow="true"></a-light>
    <a-light type="point" position="0 4 0" color="#4cc9f0" intensity="0.5"></a-light>

    <a-entity position="0 0 -4">
      <a-cylinder position="0 0.4 0" radius="0.55" height="0.8" color="#1e293b" shadow="cast: true"></a-cylinder>
      <a-cylinder position="0 1.05 0" radius="0.08" height="0.5" color="#f5c518" metalness="0.8" roughness="0.2" shadow="cast: true"></a-cylinder>
      <a-cone position="0 1.6 0" radius-bottom="0.05" radius-top="0.4" height="0.6" color="#f5c518" metalness="0.8" roughness="0.2" shadow="cast: true"></a-cone>
      <a-text value="CMC Mathematic" position="0 2.6 0" align="center" color="#ffd700" width="5"></a-text>
    </a-entity>

    <a-entity position="-3 0 -4">
      <a-cylinder position="0 0.4 0" radius="0.55" height="0.8" color="#1e293b" shadow="cast: true"></a-cylinder>
      <a-sphere position="0 1.3 0" radius="0.2" color="#4cc9f0" shadow="cast: true"
                animation="property: position; to: 0 1.5 0; dir: alternate; dur: 1500; loop: true; easing: easeInOutQuad"></a-sphere>
      <a-torus position="0 1.3 0" radius="0.35" radius-tubular="0.015" color="#4cc9f0" shadow="cast: true"
               animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear"></a-torus>
      <a-torus position="0 1.3 0" rotation="90 0 0" radius="0.35" radius-tubular="0.015" color="#4cc9f0" shadow="cast: true"
               animation="property: rotation; to: 450 0 0; dur: 6000; loop: true; easing: linear"></a-torus>
      <a-text value="LanQiao CS" position="0 2.4 0" align="center" color="#ffd700" width="5"></a-text>
    </a-entity>

    <a-entity position="3 0 -4">
      <a-cylinder position="0 0.4 0" radius="0.55" height="0.8" color="#1e293b" shadow="cast: true"></a-cylinder>
      <a-octahedron position="0 1.3 0" radius="0.35" color="#e0e1dd" metalness="0.9" roughness="0.1" shadow="cast: true"
                    animation="property: rotation; to: 0 360 0; dur: 8000; loop: true; easing: linear"></a-octahedron>
      <a-text value="Market Research" position="0 2.4 0" align="center" color="#ffd700" width="5"></a-text>
    </a-entity>

    <a-camera position="0 1.8 5"></a-camera>
  </a-scene>
</body>
</html>
