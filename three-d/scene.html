<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>虚拟荣誉殿堂</title>
  <script src="https://cdn.staticfile.net/aframe/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-sky color="#121212"></a-sky>

    <a-plane position="0 0 -4" rotation="-90 0 0" width="15" height="15" color="#2c3e50"></a-plane>

    <a-cylinder position="0 0.5 -5" radius="0.6" height="1" color="#8e44ad"></a-cylinder>
    <a-box position="0 1.6 -5" width="0.8" height="1" depth="0.1" color="#f1c40f"
           animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
    </a-box>

    <a-cylinder position="-2.5 0.4 -4" radius="0.4" height="0.8" color="#34495e"></a-cylinder>
    <a-sphere position="-2.5 1.2 -4" radius="0.35" color="#e74c3c"
              animation="property: position; to: -2.5 1.4 -4; dir: alternate; dur: 1500; loop: true">
    </a-sphere>

    <a-cylinder position="2.5 0.4 -4" radius="0.4" height="0.8" color="#34495e"></a-cylinder>
    <a-box position="2.5 1.1 -4" width="0.5" height="0.5" depth="0.5" color="#3498db"
           animation="property: rotation; to: 360 360 360; dur: 5000; loop: true; easing: linear">
    </a-box>

    <a-light type="ambient" color="#ffffff" intensity="0.5"></a-light>
    <a-light type="point" position="0 4 -3" color="#f1c40f" intensity="0.8"></a-light>

    <a-camera position="0 1.6 0"></a-camera>
  </a-scene>
</body>
</html>
