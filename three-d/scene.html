<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>云南大学虚拟荣誉殿堂</title>
  <script src="https://cdn.staticfile.net/aframe/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene>
   
    <a-sky color="#0b0f19"></a-sky>


    <a-plane position="0 0 -4" rotation="-90 0 0" width="18" height="18" color="#1a2234"></a-plane>

    <a-cylinder position="0 0.4 -5" radius="0.55" height="0.8" color="#243049"></a-cylinder>
    <a-box position="0 1.3 -5" width="0.7" height="0.8" depth="0.1" color="#f39c12"
           animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
    </a-box>
  
    <a-text value="CMC数学竞赛展牌" position="0 2.0 -5" align="center" color="#f39c12" width="4"></a-text>

    
    <a-cylinder position="-2.5 0.3 -4" radius="0.38" height="0.6" color="#243049"></a-cylinder>
    <a-sphere position="-2.5 0.9 -4" radius="0.28" color="#e74c3c"
              animation="property: position; to: -2.5 1.1 -4; dir: alternate; dur: 1500; loop: true">
    </a-sphere>
    <a-text value="蓝桥杯软件大赛" position="-2.5 1.5 -4" align="center" color="#e74c3c" width="4"></a-text>

    <a-cylinder position="2.5 0.3 -4" radius="0.38" height="0.6" color="#243049"></a-cylinder>
    <a-box position="2.5 0.9 -4" width="0.45" height="0.45" depth="0.45" color="#3498db"
           animation="property: rotation; to: 360 360 360; dur: 5000; loop: true; easing: linear">
    </a-box>
    
    <a-text value="市场调研与分析" position="2.5 1.5 -4" align="center" color="#3498db" width="4"></a-text>

  
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="point" position="0 3.5 -3" color="#f1c40f" intensity="1.2" distance="8"></a-light>

    <a-camera position="0 1.6 1"></a-camera>
  </a-scene>
</body>
</html>
