<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园学科竞赛与组队大厅</title>
  <link href="https://cdn.staticfile.net/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script defer src="https://cdn.staticfile.net/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script defer src="https://cdn.staticfile.net/echarts/5.4.3/echarts.min.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top mb-5" aria-label="主导航栏">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">
        <img src="OIP-C.webp" alt="校徽" style="height: 36px; margin-right: 10px; object-fit: contain; border-radius: 50%;">
        竞赛组队大厅
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="切换导航菜单">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#home">竞赛大厅</a></li>
          <li class="nav-item"><a class="nav-link" href="#dashboard">赛事数据看板</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">荣誉殿堂(3D)</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <header class="hero-section rounded-4 mb-5 text-white text-center d-flex flex-column justify-content-center align-items-center">
      <h1 class="display-5 fw-bold mb-3">校园学科竞赛与组队中心</h1>
      <p class="lead text-white-50 mb-0">探索 · 创新 · 卓越</p>
    </header>

    <section id="home" class="mb-5 py-4">
      <h2 class="h4 fw-bold text-secondary mb-4">近期竞赛列表</h2>
      <div class="d-flex flex-wrap gap-2 mb-3" id="filter-buttons" role="group" aria-label="竞赛分类筛选">
        <button class="btn btn-primary rounded-pill px-4" data-type="all">全部</button>
        <button class="btn btn-outline-primary rounded-pill px-4" data-type="计算机类">计算机类</button>
        <button class="btn btn-outline-primary rounded-pill px-4" data-type="理科类">理科类</button>
        <button class="btn btn-outline-primary rounded-pill px-4" data-type="商科类">商科类</button>
      </div>
      <div class="row g-3" id="competition-list">
      </div>
    </section>

    <section id="dashboard" class="mb-5 py-4">
      <h2 class="h4 fw-bold text-secondary mb-4">历年参赛数据分析</h2>
      <div id="chart-container" class="chart-box bg-white border rounded p-3 shadow-sm" role="region" aria-label="历年赛事规模与竞赛分类占比统计图表"></div>
    </section>
  </main>
</body>
</html>
