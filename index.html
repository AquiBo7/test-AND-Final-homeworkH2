<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园学科竞赛与组队大厅</title>
  <link href="https://cdn.staticfile.net/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">竞赛组队大厅</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="#home">竞赛大厅</a></li>
          <li class="nav-item"><a class="nav-link" href="#dashboard">赛事数据看板</a></li>
          <li class="nav-item"><a class="nav-link" href="three-d/scene.html">荣誉殿堂(3D)</a></li>
        </ul>

    </div>
  </nav>

  <main class="container">
    <section id="home" class="mb-5">
      <h2 class="mb-4">近期竞赛列表</h2>
      <div class="mb-3" id="filter-buttons">
        <button class="btn btn-primary" data-type="all">全部</button>
        <button class="btn btn-outline-primary" data-type="计算机类">计算机类</button>
        <button class="btn btn-outline-primary" data-type="理科类">理科类</button>
        <button class="btn btn-outline-primary" data-type="商科类">商科类</button>
      </div>
      <div class="row g-3" id="competition-list">
      </div>
    </section>

    <section id="dashboard" class="mb-5">
      <h2 class="mb-4">历年参赛数据分析</h2>
      <div id="chart-container" class="chart-box bg-white border rounded p-3"></div>
    </section>
  </main>

  <script src="https://cdn.staticfile.net/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.staticfile.net/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
